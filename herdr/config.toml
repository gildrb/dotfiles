onboarding = false

[theme]
name = "terminal"

[theme.custom]
panel_bg = "#000000"
sidebar_bg = "#000000"
active_row_bg = "#0c0602"
selection_bg = "#000066"
surface0 = "#0c0602"
surface1 = "#160e04"
surface_dim = "#040200"
overlay0 = "#ff7b25"
overlay1 = "#ffa914"
text = "#ffc757"
subtext0 = "#faa003"
accent = "#ffa914"
mauve = "#ffbf72"
green = "#05d83d"
yellow = "#fade01"
red = "#ff9381"
blue = "#60e3e2"
teal = "#ffdc96"
peach = "#fade01"

[terminal]
new_cwd = "follow"
shell_mode = "auto"

[update]
version_check = false
manifest_check = false

[keys]
prefix = "ctrl+b"
new_tab = "prefix+c"
rename_tab = "prefix+r"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
switch_workspace = "prefix+shift+1..9"
new_workspace = "prefix+a"
close_workspace = "prefix+q"
workspace_picker = "prefix+s"
previous_workspace = "prefix+u"
next_workspace = "prefix+i"
previous_agent = "prefix+,"
next_agent = "prefix+."
focus_agent = "prefix+alt+1..9"
goto = "prefix+g"
settings = "prefix+shift+s"
reload_config = "prefix+shift+c"
detach = "prefix+d"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "h"
navigate_pane_down = "n"
navigate_pane_up = "p"
navigate_pane_right = "l"
cycle_pane_next = ["prefix+o", "prefix+y"]
split_vertical = ["prefix+shift+h", "prefix+|"]
swap_pane_left = ""
split_horizontal = ["prefix+shift+v", "prefix+minus"]
close_pane = "prefix+x"
resize_mode = "prefix+shift+r"

[ui]
# Agent panel ordering: "spaces" (grouped by space) or "priority" (attention queue).
agent_panel_sort = "priority"
mouse_capture = true
copy_on_select = true
confirm_close = true
prompt_new_tab_name = false
prompt_new_workspace_name = false
pane_borders = "auto"
pane_gaps = false
hide_tab_bar_when_single_tab = false
sidebar_start_collapsed = true
sidebar_collapsed_mode = "compact"

[ui.sound]
enabled = false

[ui.toast]
delivery = "off"

[ui.toast.clipboard]
enabled = false

[session]
resume_agents_on_restore = true

[advanced]
scrollback_limit_bytes = 10000000
