onboarding = false

[theme]
name = "terminal"

[theme.custom]
panel_bg = "#09090b"
surface0 = "#141416"
surface1 = "#1c1c1f"
surface_dim = "#0d0d0f"
overlay0 = "#a0a0a0"
overlay1 = "#c9c9c9"
text = "#ededed"
subtext0 = "#a0a0a0"
accent = "#fe598f"
mauve = "#c674f9"
green = "#10c955"
yellow = "#ffb200"
red = "#ff6a6e"
blue = "#5fa5ff"
teal = "#52f0db"
peach = "#ffb200"

[terminal]
new_cwd = "follow"
shell_mode = "auto"

[update]
version_check = false
manifest_check = false

[keys]
prefix = "ctrl+b"
new_tab = "prefix+c"
rename_tab = "prefix+r"
previous_tab = "prefix+p"
next_tab = "prefix+n"
switch_tab = "prefix+1..9"
new_workspace = "prefix+a"
close_workspace = "prefix+q"
workspace_picker = "prefix+s"
previous_workspace = "prefix+u"
next_workspace = "prefix+i"
previous_agent = "prefix+,"
next_agent = "prefix+."
focus_agent = "prefix+alt+1..9"
goto = "prefix+g"
settings = "prefix+shift+s"
reload_config = "prefix+shift+c"
detach = "prefix+d"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "h"
navigate_pane_down = "n"
navigate_pane_up = "p"
navigate_pane_right = "l"
cycle_pane_next = ["prefix+o", "prefix+y"]
split_vertical = ["prefix+shift+h", "prefix+|"]
swap_pane_left = ""
split_horizontal = ["prefix+shift+v", "prefix+minus"]
close_pane = "prefix+x"
resize_mode = "prefix+shift+r"

[ui]
# Agent panel ordering: "spaces" (grouped by space) or "priority" (attention queue).
agent_panel_sort = "priority"
mouse_capture = true
copy_on_select = true
confirm_close = true
prompt_new_tab_name = false
prompt_new_workspace_name = false
pane_borders = true
pane_gaps = false
hide_tab_bar_when_single_tab = false

[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"

[session]
resume_agents_on_restore = true

[advanced]
scrollback_limit_bytes = 10000000
