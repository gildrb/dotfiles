theme:
  dark: death-note
  light: death-note
defaultThinkingLevel: xhigh
steeringMode: all
followUpMode: one-at-a-time
showHardwareCursor: false
startup:
  quiet: true
  changelogMode: hidden
  checkUpdate: false
  setupWizard: false
compaction:
  enabled: true
symbolPreset: ascii
composer:
  shape: pi
statusLine:
  preset: custom
  leftSegments:
    - model
    - path
    - git
  rightSegments:
    - context_pct
  segmentOptions:
    model:
      showThinkingLevel: false
    path:
      abbreviate: true
      maxLength: 35
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
  separator: slash
  sessionAccent: false
  transparent: true
  compactThinkingLevel: true
terminal:
  showProgress: false
tui:
  textSizing: false
  tight: true
display:
  shimmer: classic
  cacheMissMarker: true
plan:
  enabled: false
goal:
  enabled: true
  statusInFooter: false
