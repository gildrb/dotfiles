theme:
  dark: death-note
  light: death-note
skillful: false
skills:
  enabled: true
  enableSkillCommands: true
steeringMode: one-at-a-time
followUpMode: one-at-a-time
showHardwareCursor: true
defaultThinkingLevel: low
textVerbosity: low
doubleEscapeAction: tree
retry:
  usageReservePct: 15
startup:
  quiet: true
  changelogMode: hidden
  checkUpdate: false
  setupWizard: false
compaction:
  enabled: true
  midTurnEnabled: true
  asyncEnabled: true
  autoContinue: true
symbolPreset: ascii
composer:
  shape: borderless
statusLine:
  preset: ascii
  leftSegments:
    - model
    - path
    - git
  rightSegments:
    - context_pct
  segmentOptions:
    model:
      showThinkingLevel: true
    path:
      abbreviate: true
      maxLength: 35
      stripWorkPrefix: true
    git:
      showBranch: true
      showStaged: false
      showUnstaged: false
      showUntracked: false
  separator: ascii
  sessionAccent: true
  transparent: true
  compactThinkingLevel: false
terminal:
  showProgress: true
  showImages: true
tui:
  textSizing: false
  tight: true
  renderMermaid: true
  hyperlinks: auto
display:
  shimmer: kitt
  smoothStreaming: true
  hideToolActivity: false
  showTokenUsage: true
  collapseCompacted: true
  cacheMissMarker: true
plan:
  enabled: false
goal:
  enabled: true
  statusInFooter: true
images:
  autoResize: true
  blockImages: false
  describeForTextModels: true
bashInterceptor:
  enabled: true
security:
  enabled: true
computer:
  enabled: true
astGrep:
  enabled: true
task:
  eager: preferred
  enableLsp: true
  showResolvedModelBadge: true
  isolation:
    enabled: true
    apply: true
    merge: patch
python:
  kernelMode: session
eval:
  py: true
  js: true
  tools:
    enabled: true
  autoBackground:
    enabled: true
  workpool:
    freshAgents: false
edit:
  mode: hashline
lsp:
  enabled: true
  lazy: true
  shared: true
  diagnosticsOnWrite: true
  diagnosticsOnEdit: true
  diagnosticsDeduplicate: true
