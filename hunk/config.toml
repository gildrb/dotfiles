hunk_headers = true
line_numbers = true
menu_bar = true
mode = "auto"
theme = "death-note"
transparent_background = true
watch = true
wrap_lines = false

[themes.death-note]
accent = "#ff6f95"
base = "github-dark-default"
label = "Death Note"
noteBorder = "#9a2a4e"
panel = "#09090b"

[themes.death-note.syntax_scopes]
comment = "#a0a0a0"
"constant.numeric" = "#ededed"
"entity.name.function" = "#51aeff"
"entity.name.type" = "#ededed"
keyword = "#ff6f95"
"keyword.operator" = "#c9c9c9"
punctuation = "#a8a8a8"
"punctuation.definition.comment" = "#a0a0a0"
"storage.type" = "#ededed"
string = "#5ee9b5"
variable = "#ededed"
