# Shared mise configuration for macOS and NixOS.
#
# Ownership: Nix owns the host, its services, and the mise binary itself;
# mise owns versioned developer tools and runtimes. Homebrew-compatible
# packages below are macOS only (os = "macos") and never touch NixOS.

[tools]
node = "26"
python = "3.14"
ruby = "4.0"
go = "1.27"
rust = "1.98.1"
bun = "1.4"
deno = "2"
java = "temurin-26"
zig = "0.16"
terraform = "1.16"
opentofu = "1.12"

# Adopt applications that are already present in /Applications instead of
# reinstalling them; mise skips adoption when contents do not match.
[bootstrap.brew]
adopt = true

[bootstrap.brew.taps]
"abue-ammar/tinycast" = "https://github.com/abue-ammar/homebrew-tinycast.git"
"gildrb/heph" = "https://github.com/gildrb/homebrew-heph.git"

[bootstrap.packages]
# Formulae; third-party taps use fully qualified names.
"brew:nmap" = { version = "latest", os = "macos" }
"brew:gildrb/heph/heph" = { version = "latest", os = "macos" }

# GUI applications. Proton Mail's desktop app includes Proton Calendar.
"brew-cask:blender" = { version = "latest", os = "macos" }
"brew-cask:devin-cli" = { version = "latest", os = "macos" }
"brew-cask:figma" = { version = "latest", os = "macos" }
"brew-cask:filen" = { version = "latest", os = "macos" }
"brew-cask:font-ioskeley-mono" = { version = "latest", os = "macos" }
"brew-cask:ghostty" = { version = "latest", os = "macos" }
"brew-cask:helium-browser" = { version = "latest", os = "macos" }
"brew-cask:plasticity" = { version = "latest", os = "macos" }
"brew-cask:proton-mail" = { version = "latest", os = "macos" }
"brew-cask:rive" = { version = "latest", os = "macos" }
"brew-cask:signal" = { version = "latest", os = "macos" }
"brew-cask:sketch" = { version = "latest", os = "macos" }
"brew-cask:abue-ammar/tinycast/tinycast" = { version = "latest", os = "macos" }
"brew-cask:tldraw" = { version = "latest", os = "macos" }
"brew-cask:utm" = { version = "latest", os = "macos" }
"brew-cask:vorssaint" = { version = "latest", os = "macos" }
"brew-cask:zed" = { version = "latest", os = "macos" }
